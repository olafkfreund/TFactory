# Grandfathered security-sink findings for THIS repo.
#
# Read by `security-lint/security_lint.py`, which is vendored byte-exact from
# the Factory hub. See that file's header for the full design.
#
# THIS FILE IS NOT AN IGNORE LIST. Four rules make that stick, all enforced by
# the gate itself, not by convention:
#
#   * `issue` is REQUIRED and must look like `Repo#123`. An entry without one
#     fails the gate. A grandfathered security finding with nobody's name on it
#     is a permanent exception wearing a temporary hat.
#   * An entry that matches NOTHING fails the gate. Fix the finding and you must
#     delete the entry — so this list can only ratchet down.
#   * `count` (default 1) is a ceiling, not a per-file waiver. A SECOND
#     `pickle.load` in an already-listed file is a new finding and turns the
#     gate red.
#   * `expires` is optional and enforced when present.
#
# THERE IS NO S301 ENTRY, DELIBERATELY.
# `apps/web-server/server/services/skills_service.py` called `pickle.load` on a
# startup cache file for months. It is the reason this gate exists. It was
# FIXED (TFactory#1058, pickle -> JSON) rather than grandfathered here, and
# until that fix merged this gate was RED on this branch — deliberately. A
# security gate that would grandfather a live RCE to keep its own introduction
# PR green is not a gate.
#
# The gate went green when the fix landed and this branch rebased on `dev`,
# with no edit to this file. That is the intended property: the transition
# itself is the evidence the fix reached the default branch. If an S301 entry
# ever appears here, read it as a decision someone made, not as housekeeping.

[[allow]]
path = "apps/backend/prompts_pkg/prompt_generator.py"
rule = "S608"
count = 1
reason = "Not SQL. The f-string is the coder-agent PROMPT; ruff's heuristic matches SQL keywords in a formatted string. Nothing in this function touches a database."
issue = "Factory#723"

[[allow]]
path = "apps/backend/runners/github/providers/azure_devops_provider.py"
rule = "S608"
count = 1
reason = "The injection is FIXED (Factory#721): the project name goes through the canonical `_wiql_literal`, which doubles every single quote, so a tenant-supplied name can only ever be compared as data. The finding remains because WIQL has no parameter binding at all -- the endpoint takes one opaque query string -- so ruff still sees interpolation and cannot see the escaping. That leaves it in the Factory#723 class: unavoidable interpolation, checked at the interpolation point."
issue = "Factory#723"

[[allow]]
path = "apps/web-server/server/database/alembic/versions/20260525_c6e3b2d4a8f0_encrypt_credentials.py"
rule = "S608"
count = 2
reason = "Table and column names come from _CRED_COLUMNS, a module-level literal tuple in the same file; a migration takes no arguments. SQL cannot parameterise identifiers, so interpolation is unavoidable."
issue = "Factory#723"

[[allow]]
