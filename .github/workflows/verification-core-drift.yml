name: verification-core drift gate

# Blocking drift gate for the vendored verification-core layer (Factory#158,
# epic Factory#154).
#
# TFactory hand-vendors two modules from the Factory hub's canonical
# verification-core surface (scripts/):
#   apps/backend/agents/verification_gate.py        (RFC-0006 never-overclaim gate)
#   apps/backend/tools/runners/nix_provisioner.py   (RFC-0005 per-task Nix env)
#
# These copies MUST stay byte-identical to the hub canonical. This job checks out
# the hub at a PINNED SHA and runs the hub's own drift gate
# (scripts/check_verification_core_drift.py) against this checkout. A byte
# mismatch fails the build.
#
# To intentionally change a vendored module: land the change in the hub canonical
# first (CODEOWNERS-reviewed), re-vendor it here byte-for-byte, and bump
# HUB_PIN_SHA below. Never edit a vendored copy to satisfy a local style bar —
# the copies are governed by this byte-exact gate, not the repo style config
# (they are excluded from ruff format/lint in ruff.toml for the same reason).

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "apps/backend/agents/verification_gate.py"
      - "apps/backend/tools/runners/nix_provisioner.py"
      # Newly gated by Factory#400. Without this the gate is REGISTERED for
      # this module but never TRIGGERED by it: a PR editing the vendored
      # copy would skip the blocking check entirely.
      - "apps/backend/tools/runners/artifact_store.py"
      # Newly gated by Factory#403/#411. Without this the gate is
      # REGISTERED for this module but never TRIGGERED by it.
      - "scripts/ratchet_helpers.py"
      # Newly gated by Factory#483. TFactory now vendors the hub's job-dispatch
      # canonical instead of restating its rules by hand in three builders.
      - "apps/backend/tools/runners/job_dispatch.py"
      - ".github/workflows/verification-core-drift.yml"
  push:
    branches: [dev, main]

concurrency:
  group: vcore-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned Factory hub commit carrying the canonical verification-core modules.
  # Bump deliberately when re-vendoring (see header).
  #
  # NOTE (Factory#483): this points at the HEAD of Factory PR #485 (the canonical
  # change this re-vendors), NOT at a commit on the hub's main. Factory
  # squash-merges, so this SHA does not survive the merge — re-point it at the
  # resulting main commit before merging this PR, or the gate checks out a SHA
  # that only exists on the closed PR branch.
  HUB_PIN_SHA: "c6ce50cfcccec343a0549e18392999aba4b4f7ac"

jobs:
  drift:
    name: vendored copies match the hub canonical (byte-exact)
    runs-on: ubuntu-latest
    steps:
      - name: Check out this service
        uses: actions/checkout@v4
        with:
          path: service

      - name: Check out the Factory hub canonical at the pinned SHA
        uses: actions/checkout@v4
        with:
          repository: olafkfreund/Factory
          ref: ${{ env.HUB_PIN_SHA }}
          path: factory-hub
          # If the Factory hub is private, provide a read token here.

      - name: Check out the hub drift CHECKER at main
        # Not at HUB_PIN_SHA: a gate fetched from its own pin cannot ship its
        # own fix. The CANONICAL above stays pinned, so comparisons remain
        # reproducible; only the gate's own logic floats (Factory#405).
        uses: actions/checkout@v4
        with:
          repository: olafkfreund/Factory
          ref: main
          path: factory-hub-main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the hub drift gate against this service (blocking)
        run: |
          python factory-hub-main/scripts/check_verification_core_drift.py \
            --canonical factory-hub/scripts \
            --service tfactory \
            --root service
