name: Run TFactory suite on Copilot PR

# Trigger: a PR opened or pushed to by the copilot-swe-agent bot.
# Creates a TFactory task against the PR's head SHA so the full test
# pipeline runs and posts a commit status.
# Part of epic #277 (C4).

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: copilot-pr-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write
  pull-requests: read

jobs:
  tfactory-test:
    # Only run for PRs authored by the Copilot cloud agent bot.
    # GitHub API: user.type == "Bot" and user.login starts with "copilot-swe-agent".
    if: |
      github.event.pull_request.user.type == 'Bot' &&
      startsWith(github.event.pull_request.user.login, 'copilot-swe-agent')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set pending commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -X POST \
            -H "Content-Type: application/json" \
            -f state=pending \
            -f description="TFactory suite starting…" \
            -f context="tfactory/suite" \
            -f target_url="${{ vars.TFACTORY_URL }}"

      - name: Trigger TFactory suite
        id: trigger
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "${{ vars.TFACTORY_URL }}/api/tasks/from-pr" \
            -H "Authorization: Bearer ${{ secrets.TFACTORY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "pr_number": ${{ github.event.pull_request.number }},
              "repo": "${{ github.repository }}",
              "head_sha": "${{ github.event.pull_request.head.sha }}"
            }')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "task_created=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TFactory API returned HTTP $HTTP_STATUS; suite not started"
          else
            TASK_ID=$(echo "$BODY" | jq -r '.task_id // .spec_id // "unknown"')
            echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
            echo "task_created=true" >> "$GITHUB_OUTPUT"
            echo "TFactory task: $TASK_ID"
          fi

      - name: Update commit status (queued)
        if: steps.trigger.outputs.task_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -X POST \
            -H "Content-Type: application/json" \
            -f state=pending \
            -f description="TFactory suite queued (task: ${{ steps.trigger.outputs.task_id }})" \
            -f context="tfactory/suite" \
            -f target_url="${{ vars.TFACTORY_URL }}"

  # Factory#932. `tfactory-test` skips on every PR not authored by the Copilot
  # cloud agent, which is correct -- and invisible. A skipped job renders beside a
  # passing one in the checks list, so a verification gate whose condition was
  # never met reads, at a glance, like a suite that ran and passed. Across this
  # workflow's whole history (877 runs) the condition has never once been met,
  # because no `copilot-swe-agent[bot]` PR has ever been opened here, and nothing
  # said so. This job says so.
  #
  # It reports a reason, never a verdict, and posts no commit status: the
  # `tfactory/suite` context stays the exclusive property of a suite that actually
  # ran. Its presence makes the RUN conclude `success` where it previously
  # concluded `skipped`, so a liveness sweep must score the `tfactory-test` job.
  test-not-applicable:
    name: TFactory suite not applicable (nothing was tested)
    needs: [tfactory-test]
    if: always() && needs.tfactory-test.result == 'skipped'
    # It writes a step summary and nothing else; it needs no token at all.
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record why no suite ran
        env:
          # Bound into env rather than interpolated into the shell: a PR author
          # login is not trusted input.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail
          {
            echo "### TFactory suite: not applicable"
            echo
            echo "**Nothing was tested. This is not a pass, and no \`tfactory/suite\`"
            echo "commit status was posted.**"
            echo
            echo "This gate runs the suite only for a PR authored by the Copilot cloud"
            echo "agent (a Bot whose login starts with \`copilot-swe-agent\`)."
            printf "This PR was opened by \`%s\` (type \`%s\`).\n" "$PR_AUTHOR" "$PR_AUTHOR_TYPE"
          } >> "$GITHUB_STEP_SUMMARY"
