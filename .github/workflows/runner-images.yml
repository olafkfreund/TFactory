# runner-images.yml — Task 7 (#23), sub-task 7.4
#
# Build all TFactory framework runner images on push to main and on PRs
# that touch any Dockerfile or this workflow file.
#
# On PRs the workflow only builds + smoke-tests each image (no publish). On
# push to main, after the smoke passes, each image is published to GHCR so the
# in-cluster lanes can pull it. The k3d cluster authenticates via its existing
# `ghcr-pull` secret.
#
# Image tags produced:
#   tfactory-runner-{pytest,jest,playwright,vitest,cypress,java,selenium,cucumber,cloud}:<commit-sha>
#   tfactory-runner-{...}:latest                      (loaded locally for the smoke test)
# Published to GHCR on main only:
#   ghcr.io/<owner>/tfactory-runner-{...}:<commit-sha>
#   ghcr.io/<owner>/tfactory-runner-{...}:latest

name: Build runner images

# The negations matter (#886). `docker/tfactory-runner-*/**` matches the nix and
# portal-ui directories too, but neither is in the matrix below — nix has
# nix-runner-image.yml and portal-ui has portal-ui-runner-image.yml, because both
# need a shape this matrix cannot express. So a change to either fired this
# workflow, built nine unrelated images, went green, and built nothing that
# changed. A trigger that runs and cannot possibly do the work is worse than no
# trigger: it looks like coverage. tests/test_runner_image_workflows.py holds the
# matrix and these filters to the set of directories that actually exist.
on:
  push:
    branches: [main]
    paths:
      - 'docker/tfactory-runner-*/**'
      - '!docker/tfactory-runner-nix/**'
      - '!docker/tfactory-runner-portal-ui/**'
      - '.github/workflows/runner-images.yml'
  pull_request:
    paths:
      - 'docker/tfactory-runner-*/**'
      - '!docker/tfactory-runner-nix/**'
      - '!docker/tfactory-runner-portal-ui/**'
      - '.github/workflows/runner-images.yml'

# Cancel superseded runs on the same ref (matches ci.yml convention)
concurrency:
  group: runner-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level floor only. `permissions:` takes no expression, so a single
# job spanning both triggers granted `id-token: write` (and `packages: write`)
# to pull_request runs, which build PR-controlled Dockerfiles (#948). The
# build/publish split below is the narrowing: both elevated capabilities are
# declared on the push-only `publish` job.
permissions:
  contents: read

# The runner list appears in TWO matrix blocks below — one per job — because a
# matrix job cannot fan out into a second matrix job leg-by-leg. They must stay
# identical; tests/test_runner_image_workflows.py asserts that, so a runner
# added to one and not the other fails CI rather than going quietly unpublished.
jobs:
  # --------------------------------------------------------------------------
  # Runs on BOTH triggers: build, load, smoke. Nothing here pushes, so it needs
  # no registry credentials and no OIDC token.
  # --------------------------------------------------------------------------
  build:
    name: build ${{ matrix.runner }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false   # keep building remaining images if one fails
      matrix:
        runner: [pytest, jest, playwright, vitest, cypress, java, selenium, cucumber, cloud]

    steps:
      # Rebuild the security layer at most daily; without a changing arg the
      # `apt-get upgrade` layer is served from the build cache forever.
      - name: Compute security-refresh token
        run: echo "SECURITY_REFRESH=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docker/setup-buildx-action enables BuildKit features (layer caching,
      # multi-platform builds, --check flag). Required for dockerfile:1.7 syntax.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      # Build the image and load it into the local Docker daemon so the
      # hello-world smoke step below can run it.
      # push: false — no registry configured yet (deferred task).
      # load: true  — exports image to local daemon for the smoke test.
      - name: Build tfactory-runner-${{ matrix.runner }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: docker/tfactory-runner-${{ matrix.runner }}
          file: docker/tfactory-runner-${{ matrix.runner }}/Dockerfile
          push: false
          load: true
          # `:latest` only. This job pushes nothing -- it loads into the local
          # daemon for the smoke steps below, and every one of them runs
          # `tfactory-runner-<x>:latest`. The second tag here was a raw 40-char
          # `github.sha` that was written and never read (#890).
          tags: |
            tfactory-runner-${{ matrix.runner }}:latest
          # GHA cache: reuse layer cache across runs scoped per framework image.
          # mode=max: cache all layers, not just the final stage.
          build-args: |
            SECURITY_REFRESH=${{ env.SECURITY_REFRESH }}
          cache-from: type=gha,scope=runner-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=runner-${{ matrix.runner }}

      # Hello-world smoke: verify the image runs a trivial command.
      # Each case mirrors what test_docker_runner.py tests in CI.
      - name: Hello-world smoke — ${{ matrix.runner }}
        run: |
          case "${{ matrix.runner }}" in
            pytest)
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=64m \
                tfactory-runner-pytest:latest \
                python -c 'print("tfactory-runner-pytest ok")'
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=64m \
                tfactory-runner-pytest:latest \
                pytest --version
              ;;
            jest)
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=64m \
                tfactory-runner-jest:latest \
                node -e 'console.log("tfactory-runner-jest ok")'
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=64m \
                tfactory-runner-jest:latest \
                jest --version
              ;;
            playwright)
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=256m \
                tfactory-runner-playwright:latest \
                node -e 'console.log("tfactory-runner-playwright ok")'
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=256m \
                tfactory-runner-playwright:latest \
                npx playwright --version
              ;;
            selenium)
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=128m \
                tfactory-runner-selenium:latest \
                python -c 'import selenium; print("tfactory-runner-selenium ok", selenium.__version__)'
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=128m \
                tfactory-runner-selenium:latest \
                chromedriver --version
              ;;
            cucumber)
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=256m \
                tfactory-runner-cucumber:latest \
                node -e 'console.log("tfactory-runner-cucumber ok")'
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=256m \
                tfactory-runner-cucumber:latest \
                npx cucumber-js --version
              ;;
            vitest)
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=64m \
                tfactory-runner-vitest:latest \
                node -e 'console.log("tfactory-runner-vitest ok")'
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=64m \
                tfactory-runner-vitest:latest \
                vitest --version
              ;;
            cypress)
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=256m \
                tfactory-runner-cypress:latest \
                node -e 'console.log("tfactory-runner-cypress ok")'
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=256m \
                tfactory-runner-cypress:latest \
                cypress --version
              ;;
            java)
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=64m \
                tfactory-runner-java:latest \
                java -version
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=64m \
                tfactory-runner-java:latest \
                mvn --version
              ;;
            cloud)
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=64m \
                tfactory-runner-cloud:latest \
                prowler --version
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=64m \
                tfactory-runner-cloud:latest \
                checkov --version
              ;;
          esac

  # --------------------------------------------------------------------------
  # Publish to GHCR — only on push to main, and only after every smoke above
  # passed (a broken image never reaches the registry). PRs (incl. forks) never
  # reach this job, which is the point: `packages: write` and `id-token: write`
  # are declared here and are absent from the pull_request path entirely (#948).
  #
  # `needs: build` is job-to-job, not leg-to-leg — GitHub has no per-leg fan-out
  # — so a single failing smoke now blocks publication of ALL nine images rather
  # than just its own. That is deliberate: the alternative shapes either
  # duplicate the 130-line smoke into this job or publish past a gate that
  # failed. Nothing goes stale silently, because the run is red.
  # --------------------------------------------------------------------------
  publish:
    name: publish ${{ matrix.runner }} image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # publish runner images to GHCR
      id-token: write   # cosign keyless via GitHub OIDC (Factory#524)
    strategy:
      fail-fast: false
      matrix:
        # Must equal the `build` matrix above; the invariant test holds them so.
        runner: [pytest, jest, playwright, vitest, cypress, java, selenium, cucumber, cloud]

    env:
      IMAGE: "ghcr.io/${{ github.repository_owner }}/tfactory-runner-${{ matrix.runner }}"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `sha-<short>`, matching every other image the fleet publishes. These
      # nine used to be tagged with the raw 40-char `github.sha`, which
      # factory-gitops' `fleet-match` cannot parse — its `carries()` only
      # recognises `sha-<short>` — so the nine were invisible to the drift
      # tooling by construction (#890, factory-gitops#89). Nothing in the
      # cluster pins them by tag yet, which is exactly why this is cheap now
      # and awkward later.
      - id: tags
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-run the build to push: every layer is already in the GHA cache from
      # the build job, so this is effectively just a registry upload. This is
      # the same second build-push-action call the old single job made; it now
      # runs on its own runner, so it pulls the cache rather than inheriting it.
      - name: Push tfactory-runner-${{ matrix.runner }} to GHCR
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: docker/tfactory-runner-${{ matrix.runner }}
          file: docker/tfactory-runner-${{ matrix.runner }}/Dockerfile
          push: true
          # See nix-runner-image.yml. All nine of these Dockerfiles happen to
          # carry the label already, but "happens to" is the property #952 is
          # about: setting it on the workflow means a tenth runner added to the
          # matrix is linked whether or not its author remembers (#952).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            SECURITY_REFRESH=${{ env.SECURITY_REFRESH }}
          cache-from: type=gha,scope=runner-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=runner-${{ matrix.runner }}

      # ---------------------------------------------------------------------
      # Sign what this workflow publishes (Factory#524).
      #
      # These nine images are where generated test code is executed. The
      # admission policy covered only the four service images, so the sandbox
      # images were both unsigned and unselected by any rule — not even an
      # Audit warning. Same keyless flow as deploy.yml.
      #
      # Sign by DIGEST: cosign signatures are digest-keyed, so one signature
      # covers both :<sha> and :latest for this runner.
      #
      # The certificate SAN is derived from the workflow FILE, not the job, so
      # moving these steps into `publish` leaves the signed identity
      # byte-identical: .../runner-images.yml@refs/heads/main, which is what
      # `verify-tfactory-runner-signature` pins.
      # ---------------------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1

      - name: Sign tfactory-runner-${{ matrix.runner }}
        env:
          DIGEST: "${{ steps.push.outputs.digest }}"
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Assert the EXACT identity the admission rule pins, anchored at both
      # ends — not a repo prefix. A self-test looser than the gate it models
      # passes on signatures the gate rejects (Factory#522).
      - name: Verify signature (self-test) — ${{ matrix.runner }}
        env:
          DIGEST: "${{ steps.push.outputs.digest }}"
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/\.github/workflows/runner-images\.yml@refs/heads/main$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

      # The self-test above asks cosign about cosign. This asks the question
      # the CLUSTER asks. See the script header and Factory#804.
      - name: Assert the signature is where Kyverno looks — ${{ matrix.runner }}
        env:
          DIGEST: "${{ steps.push.outputs.digest }}"
        run: ./.github/scripts/assert-signature-location.sh "${IMAGE}" "${DIGEST}"
