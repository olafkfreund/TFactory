# nix-runner-image.yml — RFC-0005 Tier A execution substrate.
#
# Builds AND PUSHES the thin Nix base image used by the k8s Job-per-task runner
# to ghcr, so the live cluster can pull it. Separate from runner-images.yml
# (which is build-only / push-deferred) because this image must actually be
# pullable by the Jobs TFactory dispatches.
#
# Tags: ghcr.io/<owner>/tfactory-runner-nix:{<sha>,latest}

name: Build + push nix runner image

on:
  push:
    branches: [main]
    paths:
      - 'docker/tfactory-runner-nix/**'
      - '.github/workflows/nix-runner-image.yml'
  pull_request:
    paths:
      - 'docker/tfactory-runner-nix/**'
      - '.github/workflows/nix-runner-image.yml'

concurrency:
  group: nix-runner-image-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level floor only. `permissions:` takes no expression, so a single
# job spanning both triggers hands every capability it needs on push to the
# pull_request run as well — which is how `id-token: write` came to be granted
# to PR builds that execute PR-controlled Dockerfile instructions (#948). The
# split below IS the narrowing: the token capability is declared on the
# push-only `publish` job and exists nowhere else.
permissions:
  contents: read

env:
  IMAGE: "ghcr.io/${{ github.repository_owner }}/tfactory-runner-nix"

jobs:
  # --------------------------------------------------------------------------
  # pull_request path: build + load + smoke. No registry credentials, no OIDC.
  # --------------------------------------------------------------------------
  build:
    if: "${{ github.event_name == 'pull_request' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: tags
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # No `docker/login-action` here. The base image is public (nixos/nix on
      # Docker Hub) and nothing is pushed, so this path needs no GHCR
      # credentials at all — `packages: write` was granted to PR runs before
      # #948 too, and is dropped with the same change.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/tfactory-runner-nix
          file: docker/tfactory-runner-nix/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=nix-runner
          cache-to: type=gha,mode=max,scope=nix-runner

      # Smoke (image is loaded locally): nix + flakes work.
      - name: Nix smoke
        run: |
          docker run --rm "${{ env.IMAGE }}:latest" \
            nix --version
          docker run --rm "${{ env.IMAGE }}:latest" \
            sh -c 'nix flake --help >/dev/null && echo "flakes ok"'
          # #768: prove the warm-up closure actually baked into the store.
          # --offline realises the dev shell WITHOUT touching the binary cache,
          # so it can only succeed if python + pytest + pip are already present —
          # which is the entire point (a per-task flake reuses these paths and
          # skips the per-Job fetch). A cold image would fail this outright.
          docker run --rm "${{ env.IMAGE }}:latest" \
            sh -c 'nix develop --offline path:/warmup#default \
                     --command python -c "import pytest, pip; print(\"warm closure ok\")"'

  # --------------------------------------------------------------------------
  # push-to-main path: build + push + sign + self-verify.
  #
  # Mutually exclusive with `build` above rather than `needs:`-chained, because
  # the two paths share no work: the PR path loads and smokes and never pushes,
  # this path pushes and never loads. Chaining would add a second full build of
  # a multi-GB image to every push for no gate the PR run did not already
  # provide. Each event therefore does exactly the work it did before #948 --
  # only the permission boundary moved.
  # --------------------------------------------------------------------------
  publish:
    if: "${{ github.event_name == 'push' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to GHCR
      id-token: write      # cosign keyless via GitHub OIDC (Factory#524)
    steps:
      - uses: actions/checkout@v4

      - id: tags
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Same GHCR auth pattern as deploy.yml: prefer a write:packages PAT
      # (GHCR_PAT), fall back to the repo-scoped GITHUB_TOKEN.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.repository_owner }}"
          password: "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}"

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/tfactory-runner-nix
          file: docker/tfactory-runner-nix/Dockerfile
          platforms: linux/amd64
          push: true
          # GHCR links a package to a repository via this OCI label, and an
          # unlinked package inherits none of the repository's visibility or
          # permissions. Set HERE rather than in the Dockerfile (#952): nine of
          # eleven runner Dockerfiles carried it, this one did not, and nothing
          # in CI, the logs or the image made the omission visible. On the
          # workflow it cannot be forgotten by the next Dockerfile author.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=nix-runner
          cache-to: type=gha,mode=max,scope=nix-runner

      # ----------------------------------------------------------------------
      # Sign what this workflow publishes (Factory#524).
      #
      # The admission policy verified the four service images and nothing else,
      # so the one image that is the sandbox for GENERATED code was the one
      # image with no signature on it at all. Same keyless flow as deploy.yml,
      # and by DIGEST for the same reason: cosign signatures are digest-keyed,
      # so this single signature covers :sha-<short> AND :latest.
      #
      # The certificate SAN is derived from the workflow FILE, not the job, so
      # splitting the job leaves the signed identity byte-identical:
      # .../.github/workflows/nix-runner-image.yml@refs/heads/main -- which is
      # what `verify-tfactory-runner-signature` pins.
      # ----------------------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign image (cosign keyless via Sigstore + GitHub OIDC)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      # Assert the EXACT identity the admission rule pins, anchored at both
      # ends — not a repo prefix. A self-test looser than the gate it models
      # passes on signatures the gate rejects, which is the failure Factory#522
      # found in the policy itself.
      - name: Verify signature (self-test)
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/\.github/workflows/nix-runner-image\.yml@refs/heads/main$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${{ steps.build.outputs.digest }}"
