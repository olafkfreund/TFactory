# Advanced CodeQL setup (DISABLED — rename to codeql.yml to activate; see
# .github/codeql/ROLLOUT.md). Replaces GitHub default setup and uses the custom
# barrier-aware path-injection query so verified-safe code clears.
name: "CodeQL"
on:
  push:
    # dev is included deliberately even though it is currently dormant (0
    # commits ahead of main). A security gate that only covers the branch
    # people happen to use today silently stops covering them the moment the
    # workflow changes - and AIFactory, the one sibling where dev genuinely
    # diverges, already scans both.
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "23 5 * * 1"
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
