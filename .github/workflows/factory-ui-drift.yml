name: factory-ui drift gate

# Blocking drift gate for the vendored @factory/ui portal chrome.
#
# TFactory hand-vendors two shared components from the Factory hub's canonical
# shared/factory-ui/ surface:
#   apps/frontend-web/src/components/CommandPalette.tsx
#   apps/frontend-web/src/components/PortalSwitcher.tsx
#
# These copies MUST stay byte-identical to the hub canonical. This job checks out
# the hub at a PINNED SHA and runs the hub's own drift gate
# (scripts/check_factory_ui_drift.py) against this checkout. A byte mismatch
# fails the build.
#
# To intentionally change a vendored component: land the change in the hub
# canonical first, re-vendor it here byte-for-byte, and bump HUB_PIN_SHA below.

on:
  pull_request:
    branches: [dev, main, "feat/**", "release/**"]
    paths:
      - "apps/frontend-web/src/components/CommandPalette.tsx"
      - "apps/frontend-web/src/components/PortalSwitcher.tsx"
      - ".github/workflows/factory-ui-drift.yml"
  push:
    branches: [dev, main]

concurrency:
  group: factory-ui-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned Factory hub commit carrying the canonical @factory/ui components.
  # Bump deliberately when re-vendoring (see header).
  HUB_PIN_SHA: "43cc78ab13790afd8f881b48c0c7383c9fcc1141"

jobs:
  drift:
    name: vendored copies match the hub canonical (byte-exact)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out this service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: service

      - name: Assert the pinned canonical SHA is really on hub main
        # HUB_PIN_SHA lives in THIS file, and on a `pull_request` trigger this
        # file is the PR's copy -- so the pin is PR-controlled and is handed
        # straight to actions/checkout as a `ref`. Every fork of Factory shares
        # one object store, so a commit existing only in a fork is a valid
        # 40-hex SHA that actions/checkout resolves happily: a fork PR could pin
        # a canonical crafted to match its own drifted vendored copy and this
        # gate would go green (TFactory#1049). The CHECKER checkout below is at
        # `ref: main`, a branch this repo names, so it needs no such assert.
        # Path: this job checks the service out under service/, so the script
        # lives at service/.github/scripts/.
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ env.HUB_PIN_SHA }}
        run: service/.github/scripts/assert-hub-pin-on-main.sh "${SHA}" "factory-ui-drift.yml HUB_PIN_SHA"

      - name: Check out the Factory hub canonical at the pinned SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: olafkfreund/Factory
          ref: ${{ env.HUB_PIN_SHA }}
          path: factory-hub

      - name: Check out the hub drift CHECKER at main
        # Not at HUB_PIN_SHA: a gate fetched from its own pin cannot ship its
        # own fix. The CANONICAL above stays pinned, so comparisons remain
        # reproducible; only the gate's own logic floats (Factory#405).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: olafkfreund/Factory
          ref: main
          path: factory-hub-main

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run the hub drift gate against this service (blocking)
        run: |
          python factory-hub-main/scripts/check_factory_ui_drift.py \
            --canonical factory-hub/shared/factory-ui \
            --service tfactory \
            --root service
