name: Runtime base image

on:
  push:
    # The task branch seeds GHCR before the first digest-pinned Dockerfile PR.
    branches: [dev, feat/3880-ghcr-base-images]
    paths:
      - docker/base.Dockerfile
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Name the build
        id: meta
        run: |
          echo "tag=runtime-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "refresh=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push runtime base
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/base.Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/olafkfreund/tfactory-base:${{ steps.meta.outputs.tag }}
            ghcr.io/olafkfreund/tfactory-base:runtime-seed
          build-args: SECURITY_REFRESH=${{ steps.meta.outputs.refresh }}
          cache-from: type=gha,scope=runtime-base
          cache-to: type=gha,mode=max,scope=runtime-base

      - name: Open digest bump PR when the base changed
        env:
          GH_TOKEN: ${{ secrets.GITOPS_PAT }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          old="$(sed -nE 's|^FROM ghcr.io/olafkfreund/tfactory-base:[^ ]+@sha256:([0-9a-f]{64}) AS runtime$|\1|p' Dockerfile)"
          if [ "$old" = "${DIGEST#sha256:}" ]; then
            echo 'Runtime base digest unchanged'
            exit 0
          fi
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path('Dockerfile')
          content = path.read_text()
          content, count = re.subn(
              r'^FROM (?:cgr\.dev/chainguard/python:latest-dev|ghcr\.io/olafkfreund/tfactory-base:[^ ]+)@sha256:[0-9a-f]{64} AS runtime$',
              f'FROM ghcr.io/olafkfreund/tfactory-base:{os.environ["TAG"]}@{os.environ["DIGEST"]} AS runtime',
              content,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit('Expected exactly one pinned runtime FROM line')
          for first, last in (
              ('# Pull all available Wolfi security patches', '# Node from the official image'),
              ('# System packages from Wolfi APK index.', '# The npm copied'),
              ('# Remove the base image\'s pip too', '# Git identity'),
          ):
              if first in content:
                  start = content.index(first)
                  end = content.index(last, start)
                  content = content[:start] + '# Wolfi packages are installed in docker/base.Dockerfile.\n\n' + content[end:]
          content = content.replace(
              '# the base copies are apk-deleted below.',
              '# the base copies are apk-deleted in docker/base.Dockerfile.',
          )
          if any(command in content for command in ('RUN apk add', 'RUN apk del', 'apk upgrade --no-cache')):
              raise SystemExit('Main Dockerfile still contains a Chainguard package-index operation')
          path.write_text(content)
          PY
          git diff --exit-code --quiet Dockerfile && { echo 'Runtime FROM line not changed' >&2; exit 1; }
          branch="chore/3880-tfactory-base-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Dockerfile
          git commit -m "chore(deps): pin TFactory runtime base ${TAG} (#3880)"
          gh auth setup-git
          git push origin "$branch"
          gh pr create --base dev --head "$branch" \
            --title "chore(deps): pin TFactory runtime base ${TAG}" \
            --body 'Pins the GHCR runtime base image by digest. Closes olafkfreund/Factory#3880.'
