name: TFactory coverage gate on PR

# Measures line coverage on the PR head AND on the PR base, compares them, and
# publishes `tfactory/coverage` as a real pass/fail.
#
# It used to ask the cluster for a figure instead of measuring one (epic #277).
# Nothing ever recorded a figure, so every PR got the same honest, useless
# answer -- "no coverage for this commit" -- published as `success`. Three
# defects had to be cleared before that became visible (#853 terminal state,
# #857 error-vs-absence, #861 a stale token), and clearing them only proved the
# gate had never gated: a truthful "I did not check" is not a gate (#861).
#
# So it measures. Both sides run in this one job with the same interpreter, the
# same installed dependencies and the same flags, differing only in the tree --
# which makes the two numbers comparable by construction. A stored baseline
# would be cheaper and is what the old design reached for, but a baseline
# produced by an unknown command, by a service that may be down, is how this
# gate rotted unnoticed for months.
#
# The measured figure is also POSTed to TFactory, so /api/coverage finally has
# per-commit data to serve. That record is best-effort: the gate's verdict comes
# from what it measured here, never from what the cluster does or does not hold.

on:
  pull_request:
    types: [opened, synchronize]
  # Re-run the coverage check without pushing a commit. The gate depends on
  # things that live outside the repo, so it can go stale while the code is
  # unchanged -- exactly what happened with TFACTORY_TOKEN (#861), which sat
  # invalid from a cluster rebuild until someone tested it by hand. Without a
  # manual trigger the only way to retest is an empty commit on someone else's
  # PR.
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to gate coverage for"
        required: true
        type: string

concurrency:
  group: pr-review-tests-${{ github.event.pull_request.number || inputs.pr }}-${{ github.event.pull_request.head.sha || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  coverage-comment:
    runs-on: ubuntu-latest
    # Two full suite runs at ~2.5 minutes each, plus dependency install.
    timeout-minutes: 45
    steps:
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # workflow_dispatch has NO github.event.pull_request context. Without
          # this the steps below would interpolate to empty strings and the job
          # would run to a green finish having measured nothing -- reporting
          # success without checking, which is the defect this workflow exists
          # to stop doing.
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NUM="${{ inputs.pr }}"
            read -r SHA BASE < <(gh pr view "$NUM" --repo "${{ github.repository }}" \
              --json headRefOid,baseRefOid -q '.headRefOid + " " + .baseRefOid')
          else
            NUM="${{ github.event.pull_request.number }}"
            SHA="${{ github.event.pull_request.head.sha }}"
            BASE="${{ github.event.pull_request.base.sha }}"
          fi
          if [ -z "$NUM" ] || [ -z "$SHA" ] || [ -z "$BASE" ]; then
            echo "could not resolve a pull request number, head sha and base sha" >&2
            exit 1
          fi
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE" >> "$GITHUB_OUTPUT"
          echo "Resolved PR #$NUM at $SHA (base $BASE)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR head itself, not the merge commit: the base side is checked
          # out from this same clone, so both measurements come from one
          # history. Full depth because the base commit must be present.
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "latest"

      - name: Create venv + install deps
        working-directory: apps/backend
        # ONE dependency set for both measurements. Installing separately per
        # side would let a resolver difference show up as a coverage change.
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install -r ../web-server/requirements.txt
          uv pip install -r ../../tests/requirements-test.txt

      - name: Measure coverage on head and base
        id: coverage
        # continue-on-error so a DROP still reaches the status step below; the
        # job is failed explicitly at the end. Without it a red gate would skip
        # straight past the status post and leave the commit at `pending`,
        # which is the #853 stall wearing yet another hat.
        continue-on-error: true
        run: |
          apps/backend/.venv/bin/python scripts/coverage_gate.py \
            --base "${{ steps.pr.outputs.base_sha }}"

      - name: Record the figure in TFactory
        # Best-effort by design. The verdict is already decided above from a
        # local measurement; this only fills the ledger /api/coverage serves.
        # It must never turn a measured verdict into a green tick, so it cannot
        # fail the job -- but it also must not fail silently, hence the warning.
        if: steps.coverage.outputs.head_pct != ''
        env:
          TFACTORY_URL: ${{ vars.TFACTORY_URL }}
          TFACTORY_TOKEN: ${{ secrets.TFACTORY_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
          PCT: ${{ steps.coverage.outputs.head_pct }}
          RUN_ID: ci-${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${TFACTORY_URL}" ]; then
            echo "::warning::TFACTORY_URL is not set; the measured figure was not recorded."
            exit 0
          fi
          CODE=$(curl -s -o /tmp/record.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${TFACTORY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"${REPO}\",\"sha\":\"${HEAD_SHA}\",\"coverage_pct\":${PCT},\"run_id\":\"${RUN_ID}\"}" \
            "${TFACTORY_URL}/api/coverage") || CODE=000
          if [ "${CODE}" = "201" ]; then
            echo "recorded ${PCT}% for ${HEAD_SHA} in TFactory"
          else
            echo "::warning::TFactory did not record the figure (HTTP ${CODE}): $(head -c 300 /tmp/record.json)"
          fi

      - name: Find existing coverage comment
        if: always()
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad  # v4.0.0
        id: find_comment
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          comment-author: github-actions[bot]
          body-includes: "### TFactory coverage"

      - name: Post or update coverage comment
        if: always()
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9  # v5.0.0
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ steps.pr.outputs.number }}
          edit-mode: replace
          body: |
            ### TFactory coverage

            ${{ steps.coverage.outputs.head_pct != '' && format('**{0}%** on this PR vs **{1}%** on its base (`{2}` pts).', steps.coverage.outputs.head_pct, steps.coverage.outputs.base_pct, steps.coverage.outputs.delta) || '**Not measured.** The gate could not produce a comparison; see the run log.' }}

            **${{ steps.coverage.outcome == 'success' && 'PASS' || 'FAIL' }}** - ${{ steps.coverage.outputs.description || 'Coverage gate did not complete.' }}

            > _Measured by the [TFactory coverage gate](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) on both the PR head and its base._

      - name: Set commit status
        # ALWAYS post a terminal state (#853).
        #
        # This step has now been wrong in three ways. It first posted
        # `pending`, a permanent stall by construction, so merges were forced
        # with --admin (#846). Posting nothing was the same stall in a
        # different hat: GitHub reports a commit carrying zero statuses as
        # combined state `pending`, and silence cannot overwrite a stale one.
        # Then it posted `success` unconditionally, which is terminal, honest
        # about having no figure, and still not a gate (#861).
        #
        # Now there is always a figure, because this job measures one. `success`
        # means measured and not dropped; `failure` means either a measured drop
        # or a measurement that did not complete. A gate that cannot measure
        # must not report success -- that conflation is the whole bug.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PASSED: ${{ steps.coverage.outputs.passed }}
          DESCRIPTION: ${{ steps.coverage.outputs.description }}
          TFACTORY_URL: ${{ vars.TFACTORY_URL }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ "${PASSED}" = "true" ]; then
            STATE="success"
          else
            STATE="failure"
          fi
          # An empty description means the job died before the gate produced
          # one (a runner failure, a cancelled install). Say that, rather than
          # posting a blank red nobody can act on.
          TEXT="${DESCRIPTION:-Coverage gate did not complete; see the workflow run}"
          # GitHub truncates a status description at 140 characters. Do it here
          # so the text that gets published is the text we chose.
          TEXT=$(printf '%s' "$TEXT" | tr -d '\n\r' | cut -c1-140)

          gh api "/repos/${REPO}/statuses/${HEAD_SHA}" \
            -X POST \
            -H "Content-Type: application/json" \
            -f state="$STATE" \
            -f description="$TEXT" \
            -f context="tfactory/coverage" \
            -f target_url="$RUN_URL"

      - name: Fail the job when coverage regressed
        # The status above is what blocks the merge; this makes the workflow
        # itself red too, so the drop is visible in the checks list and not
        # only in a commit status.
        if: steps.coverage.outcome != 'success'
        run: |
          echo "coverage gate failed: ${{ steps.coverage.outputs.description }}"
          exit 1
