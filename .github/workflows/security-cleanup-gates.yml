name: security cleanup gates

# Gate 5 (banned constructs) for this service repo. Factory#786.
#
# BLOCKING. A failure here fails the PR.
#
# Wired non-blocking in Factory#786 with one non-allowlisted finding, and that
# finding was a known gate defect rather than a leak: routes/oidc_routes.py's
# `str(exc)[:200]` is an argument to a multi-line `logger.warning(`, and the
# response two lines below is the literal "OIDC callback rejected". It was
# deliberately left red and NOT allowlisted, because the allowlist is keyed
# (path, rule) and an entry there would have grandfathered any real leak later
# added to the login callback.
#
# Factory#782 taught the gate that a line inside a `logger.*` call is not a
# response, so that finding no longer exists and this repo scans clean. The
# comment this replaces said: "when #782 lands, that finding disappears and
# this line should be deleted the same day". This is that day.
#
# Flipped BECAUSE it passes. Verified against the post-#782 checker before the
# flip, not in the hope that it would.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: security-cleanup-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUB_REPO: "olafkfreund/Factory"
  # The CHECKER tracks main, deliberately: a gate fetched from its own pin
  # cannot ship its own fix (Factory#405). Same split as
  # factory-github-drift.yml in this repo, which pins the CANONICAL but not the
  # checker. Factory#782 is an open fix to this gate's precision, and pinning
  # here would keep it from reaching the repo that needs it.
  HUB_CHECKER_REF: "main"

jobs:
  banned-constructs:
    name: Gate 5 — banned constructs (blocking, Factory#786)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - run: pip install pyyaml

      - name: Fetch the gate from the hub canonical
        # TWO files, not one: check_banned_constructs.py imports gate_evidence
        # from its sibling scripts/ directory, so fetching only the checker
        # fails at import with ModuleNotFoundError. They must land in the SAME
        # directory. factory-github-drift.yml in this repo fetches its checker
        # the same way, for the same reason.
        #
        # Unpinned by design (see HUB_CHECKER_REF), so record WHAT ran: the
        # digests go in the job log, which makes a changed checker attributable
        # after the fact even though it is not prevented beforehand. Integrity
        # and pinning are separable and this buys the cheaper half.
        run: |
          # `set -o pipefail` because a pipeline reports only its LAST stage's
          # status: `curl ... | tail` exits 0 on a 404. Actions' default shell
          # does not set it. This bit during development, where an `| tail -1`
          # printed EXIT=0 for a run that had crashed at import.
          set -o pipefail
          mkdir -p /tmp/gate
          for f in check_banned_constructs.py gate_evidence.py; do
            curl -fsSL \
              "https://raw.githubusercontent.com/${HUB_REPO}/${HUB_CHECKER_REF}/scripts/$f" \
              -o "/tmp/gate/$f"
            echo "$f sha256: $(sha256sum "/tmp/gate/$f" | cut -d" " -f1)"
          done

      - name: Prove the gate can fail before trusting a pass
        # Not ceremony. A gate that is non-blocking AND silently broken is
        # indistinguishable from one that is passing, and that is exactly the
        # combination this workflow is in for the next few weeks. --self-test
        # plants a violation, asserts the gate goes red, removes it, and
        # asserts it goes green.
        run: python3 /tmp/gate/check_banned_constructs.py --self-test

      - name: Gate 5
        run: |
          python3 /tmp/gate/check_banned_constructs.py \
            --root . \
            --allowlist banned-constructs-allowlist.yaml
