# Base-image updates for the root Dockerfile. This file is now the only thing in
# the repo that bumps a base image (Factory#436).
#
# How the gap happened. renovate.json came in with the fork from AIFactory on
# 2026-05-28, describing exactly this policy -- pinDigests, a dockerfile manager,
# a digest rule labelled base-image -- and never once acted on it. The Renovate
# GitHub App is not installed on this account: zero Renovate PRs exist across all
# five Factory repos, and no Dependency Dashboard issue was ever opened despite
# ":dependencyDashboard" being configured. The base-image digests it claimed to
# track were tracked by nothing, which is why the frontend stage sat on a
# Chainguard digest until upstream garbage-collected it (#864, AIFactory#1091).
#
# Docker-only on purpose: that is the lane that actually broke, and a narrow
# config is one that does not get switched off again the first time a weekly
# all-ecosystem run opens nine PRs at once, which is how routine updates were
# lost in the first place (AIFactory#34).
#
# Daily, not weekly. A digest pin rots in one direction only, and the gate is
# hard-down for the whole window between upstream moving and the bump landing.
#
# Verified 2026-07-30 with dependabot-cli v1.91.0 against this repo: the docker
# updater reads `tag@sha256:` pins and proposed
#   chainguard/python latest-dev  7a568bc -> 534fb1a
# rewriting the FROM line. Same tag class that was garbage-collected in #864, so
# this covers the real failure case and not a tidier neighbour of it.
#
# github-actions IS now covered -- see the second updates entry. It was listed
# here as a known gap until Factory#711 pinned all 48 flagged action refs to
# immutable SHAs; a SHA pin with no updater is a pin that rots, so the two land
# together rather than trading one exposure for another.
#
# Still not covered, stated rather than implied: helmv3 charts, and
# `COPY --from=<image>` pins -- Dependabot's Dockerfile parser only reads FROM.
# Neither was covered before either; this just stops the config from claiming
# they were. If the Renovate App is ever installed, delete this file rather than
# let two bots rewrite the same FROM lines.
version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    # Factory#491: without this, Dependabot raises against whatever the repo
    # default happens to be, and the default-branch flip to `dev` therefore split
    # bumps across both branches — base-image changes reaching the deployed
    # branch without passing through `dev`, and `main` ending up ahead of `dev`
    # in every service repo. Pin it rather than inherit it.
    target-branch: dev
    schedule:
      interval: daily
    labels:
      - dependencies
      - docker
      - base-image
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  # github-actions. Added alongside the SHA pinning in Factory#711.
  #
  # Why it is not optional: every third-party action in .github/workflows/ is now
  # pinned to a 40-character commit SHA. That closes the mutable-tag supply-chain
  # path, and it also freezes the action at that commit forever -- an upstream
  # SECURITY fix no longer arrives by moving tag. Without this updater the pins
  # silently rot, which is a worse position than the tags were in. Dependabot
  # reads the `# vX.Y.Z` trailing comment on each pin and keeps both the SHA and
  # the comment current, which is why the pins carry that exact format.
  #
  # Weekly, not daily: an action pin does not rot in one direction the way a base
  # image digest does, and the docker lane above already carries the daily cost.
  #
  # Grouped into ONE pull request on purpose. 48 pins across 11 distinct actions
  # would otherwise open up to 11 PRs in a single run -- which is precisely how
  # routine updates got switched off for noise in the first place (AIFactory#34).
  - package-ecosystem: github-actions
    directory: "/"
    # Same Factory#491 reasoning as the docker lane above: pin the target branch
    # rather than inherit it, or a default-branch flip splits bumps across both.
    target-branch: dev
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    # cosign-installer majors are a CLUSTER decision, not a dependency bump.
    #
    # v3.7.0 -> v4.1.2 takes cosign v2 -> v3, which moves signatures from the
    # legacy `sha256-<digest>.sig` tag to an OCI 1.1 referrer. Kyverno v1.18.2
    # reads the legacy tag only -- its buildCosignOptions never sets
    # ExperimentalOCI11 -- so every image built after that bump is rejected at
    # admission with "no signatures found" while CI stays green. It cost
    # AIFactory 3 days of stale deploys (Factory#799, Factory#804).
    #
    # `type: SigstoreBundle` does not rescue it either; that was tested against
    # the live cluster and still failed, because cosign v3 writes the OLD
    # payload at the NEW location and that matches neither Kyverno verifier.
    #
    # Unpin only when Kyverno can verify what the new cosign writes, proven
    # against the cluster. assert-signature-location.sh fails the build if this
    # is ever moved without that.
    ignore:
      - dependency-name: "sigstore/cosign-installer"
        update-types: ["version-update:semver-major"]
