# Test files that sit outside the paths CI collects, each with a written reason
# and an issue. Read by the hub-canonical `check_test_collection.py`
# (Factory#844), fetched at a pinned SHA by `.github/workflows/test-collection.yml`.
#
# This is a RATCHET, not an amnesty. The gate fails on a placeholder reason, on
# a missing issue, and -- the half that makes the number shrink -- on an entry
# that no longer matches a real uncollected file. An entry cannot outlive the
# problem it documents.
#
# ZERO entries. It ends empty, which is the point of a ratchet.
#
# The seven that TFactory#1133 tracked are gone: the files they described were
# renamed out of the test namespace or deleted, so the entries would now match
# nothing and the gate would fail on them.
#
# The last two -- `portal_testing/test_capability.py` and `test_dispatch.py`,
# 33 tests between them -- were never really exceptions. They DO run in CI,
# inside the runner image at `/app/portal_testing`, and were listed only because
# the gate's derivation could not map that container path back to this repo's
# `portal_testing/`. The hub gate now reads a `# test-collection: <repo path>`
# directive written on the invocation that mounts it (Factory#933,
# TFactory#1134), so they are collected rather than excused. Registering covered
# tests as exceptions is how a covered area becomes a documented gap.
#
# An empty file is not a dormant one: the gate still reads it, and it still
# fails on an entry that matches nothing, on a placeholder reason and on a
# missing issue. Adding an entry here is a reviewable diff against zero.
