# Test files that sit outside the paths CI collects, each with a written reason
# and an issue. Read by the hub-canonical `check_test_collection.py`
# (Factory#844), fetched at a pinned SHA by `.github/workflows/test-collection.yml`.
#
# This is a RATCHET, not an amnesty. The gate fails on a placeholder reason, on
# a missing issue, and -- the half that makes the number shrink -- on an entry
# that no longer matches a real uncollected file. An entry cannot outlive the
# problem it documents.
#
# Two entries. The seven that TFactory#1133 tracked are gone -- the files they
# described were renamed out of the test namespace or deleted, so the entries
# would now match nothing and the gate would fail on them. What remains:
#
#   Two real, substantial suites that DO run in CI, via a container path the
#   gate's derivation cannot map back to a repo directory (TFactory#1134).

[[allow]]
path = "portal_testing/test_capability.py"
reason = """
A real test file -- four tests, 11 asserts -- that DOES run in CI. It is
collected by `portal-ui-runner-image.yml`, which runs `python -m pytest
/app/portal_testing -q` inside the runner image, where `/app/portal_testing` is
this directory mounted in. The gate derives collected paths from workflow pytest
arguments and cannot map that container path back to a repo directory, so it
reads as uncollected. Marking it "never runs" would be false and would invite
someone to delete covered tests. Teaching the gate about container paths is
TFactory#1134. It also needs Playwright, which the host venv does not have.
"""
issue = "TFactory#1134"

[[allow]]
path = "portal_testing/test_dispatch.py"
reason = """
The largest suite in this list and the clearest reason the registry records
reality rather than convenience: 29 tests, 67 asserts, covering the portal-UI
job manifest and the visual-inspection adapter. Verified passing (`29 passed`).
Like test_capability.py it runs in CI via `/app/portal_testing` inside the
runner image, a container path the derivation cannot resolve to a repo
directory. Tracked in TFactory#1134.
"""
issue = "TFactory#1134"
