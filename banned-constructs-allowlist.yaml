# Allowlist for scripts/check_banned_constructs.py (Factory hub, vendored gate;
# see olafkfreund/Factory#718). Each entry needs a `reason` and an `issue` --
# an entry with no issue is itself a gate failure (an unreviewed grandfather
# is not a grandfather).
#
# Keyed (path, rule), so a NEW occurrence of the same rule added later to an
# allowlisted file still fails the gate.

# --- exists-then-read: a separate rule, not triaged in #718's classification
# pass (see the PFactory report on that issue: "exists-then-read | separate
# rule, not triaged here"). Grouped here rather than fixed because the fix
# shape (read-and-catch vs. check-then-read) needs its own pass across the
# fleet, not a one-off per repo.
- path: scripts/record-portal-walkthrough.ts
  rule: exists-then-read
  reason: TOCTOU check-then-read; separate rule from #718's error-disclosure classification, not yet triaged fleet-wide
  issue: 718
- path: scripts/capture-screenshots.ts
  rule: exists-then-read
  reason: TOCTOU check-then-read; separate rule from #718's error-disclosure classification, not yet triaged fleet-wide
  issue: 718
- path: scripts/capture-portal-gallery.ts
  rule: exists-then-read
  reason: TOCTOU check-then-read; separate rule from #718's error-disclosure classification, not yet triaged fleet-wide
  issue: 718
- path: scripts/bump-version.js
  rule: exists-then-read
  reason: TOCTOU check-then-read; separate rule from #718's error-disclosure classification, not yet triaged fleet-wide
  issue: 718
- path: apps/backend/core/auth.py
  rule: exists-then-read
  reason: TOCTOU check-then-read; separate rule from #718's error-disclosure classification, not yet triaged fleet-wide
  issue: 718

# --- raw-exception-in-response: genuine false positives / out-of-scope, read
# and verified individually (never a blanket allowlist of the rule).
- path: apps/web-server/tests/test_route_error_leak.py
  rule: raw-exception-in-response
  reason: >-
    False positive: line 5 is a docstring quoting an f-string EXAMPLE of the
    leak this test file exists to catch. The prose filter in
    check_banned_constructs.py deliberately does not skip it (any real f"...
    {exc}" in a response body also lives in a string token, and skipping
    f-string-shaped lines as prose would hide that). #718's classification
    comment names this exact line as a legitimate allowlist candidate.
  issue: 718
- path: apps/web-server/factory_common/http.py
  rule: raw-exception-in-response
  reason: >-
    Vendored, drift-gated, and unreachable -- three independent facts, any
    one of which would have to change before this became live. Vendored
    byte-exact from the Factory hub (shared/factory-common/), kept identical
    by the factory_common drift gate, so a local edit would break
    .hub-sha and the fix belongs in the hub canonical + re-vendor regardless.
    Unreachable: verified with a control (grepped origin/dev) --
    `HttpClient`/`HttpResponse` have zero usages outside this file, the only
    `from factory_common import ...` anywhere in the repo pulls `logsafe`
    (never `http`), and no `.body["error"]`/`.body.get("error")` access
    exists anywhere. Same result independently confirmed in PFactory,
    AIFactory, CFactory, and the hub itself (imported only by a CLI
    benchmark script there, whose output nothing reads for "error"). The
    class of finding is settled fleet-wide, not just deferred here.
  issue: 718
- path: tests/fixtures/demo-scenarios/multi-lane/sut/api_quote.py
  rule: raw-exception-in-response
  reason: >-
    Demo-harness fixture SUT (system-under-test) for the multi-lane test
    scenario, not a production route. The `except ValueError` is marked
    `pragma: no cover - guarded by Query(ge=0)` (FastAPI's own validation
    already rejects negative inputs before this branch is reachable).
  issue: 718

# --- newly visible after Factory#781 widened the detector (bare f-string
# interpolation + more exception spellings) and this branch rebased onto it.
- path: apps/backend/query_memory.py
  rule: raw-exception-in-response
  reason: >-
    False positive, verified by tracing rather than by the checker's bucket:
    zero importers in this repo or PFactory's fork (grepped both), carries
    `if __name__ == "__main__"` / argparse / sys.argv, and its sibling error
    paths use sys.stderr.write. A standalone CLI script with no HTTP surface
    -- the f"...: {e}" lands in a dict returned to a CLI caller's own
    process, not a response. #781's interpolation rule anchors partly on
    `"error":`/`'error':`, which any CLI/library return shape can carry with
    nothing to do with HTTP; recorded as a known precision cost of that rule
    rather than re-litigated per repo.
  issue: 718
