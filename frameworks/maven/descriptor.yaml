# frameworks/maven/descriptor.yaml
#
# Java / Maven descriptor (#1321). Gives Java the in-cluster unit lane it never
# had: the evaluator routes `language == "java"` to `run_maven_lane_via_nix`, and
# `_validate_framework_consistency` validates every subtask against THIS
# registry — so without a descriptor a Java subtask is rejected as
# `invalid_framework` and can never be emitted.
#
# Gradle-built Java (#3151): the Planner still pins (java, maven, unit); the
# runner picks gradle at run time when the project has no `pom.xml` anywhere and
# has a Gradle marker. The hub's `nix_provisioner._LANG_ATTRS` table still
# carries maven only (java -> [jdk21, maven]); gradle is added per task through
# `system_packages`, so there is no hub change and no re-vendoring.
#
# `frameworks/junit` also claims `java.unit` (the docker-host wedge, #237; its
# runtime `tfactory-runner-java:latest` has no container runtime in this
# cluster). The Planner is not left to chance between the two:
# `_unit_framework_for_language` prefers the candidate that declares
# `source_extensions`, which is this descriptor, so Java unit pins to maven.
#
name: maven
language: java
lanes:
  - unit

# Maven 3.9.x, the series nixpkgs ships and the fixture was proven against.
version_range: ">=3.9,<4.0"

runtime:
  # `runtime.image` is required and non-empty by the descriptor validator. As
  # with frameworks/go-test and frameworks/gradle, the image is nominal: this
  # lane runs in-cluster as a per-task Nix dev shell (RFC-0005) via
  # `run_maven_lane_via_nix`, which gets jdk21+maven from the provisioner. There
  # is no container runtime in the cluster for this lane to use.
  image: tfactory-runner-java:latest
  entrypoint:
    - mvn
    - "-B"
    - "test"

# Acceptance-criteria command tokens that pin this framework's language (#1311).
ac_command_tokens:
  - "mvn test"
  - "mvn -B test"
  - "./mvnw test"

# Deliverable extensions this language owns (#1311).
source_extensions:
  - ".java"

# Java-specific manifest signals. `pom.xml` is Maven's and unambiguous; the
# bare build.gradle* files are NOT claimed here — frameworks/gradle owns those
# for Kotlin, and a signal naming two languages is discarded as ambiguous.
manifest_signals:
  - "pom.xml"
  - "pom.xml:junit-jupiter"
  - "pom.xml:maven-surefire-plugin"

# Maven's convention: tests under src/test/java, run by Surefire.
test_path_conventions:
  - "src/test/java/**/*Test.java"
  - "**/src/test/java/**/*Test.java"

# The Nix Maven lane merges Surefire's per-class JUnit XML and collects no
# coverage. Claiming jacoco here would advertise a signal nothing produces.
coverage_strategy: skip

context_block: |
  You are generating JUnit 5 (Jupiter) tests in Java, run by `mvn test`.

  Placement:
    - Tests go under the module's `src/test/java/`, mirroring the package of the
      code under test (e.g. `src/test/java/com/acme/CalcTest.java` for
      `src/main/java/com/acme/Calc.java`).
    - One test class per class under test, named `<ClassName>Test` — Surefire
      only picks up `*Test`, `Test*` or `*Tests` by default.
    - The same placement and naming apply under a Gradle build
      (`src/test/java`, `*Test`, JUnit 5).

  Test structure:
    - One `@Test` method per behaviour, named descriptively
      (e.g. `void returnsEmptyWhenInputBlank()`).
    - Package-private class and methods are fine; JUnit 5 does not need `public`.
    - Use `@Nested` inner classes when a unit has several behaviours.

  Assertions:
    - `org.junit.jupiter.api.Assertions` (`assertEquals`, `assertTrue`,
      `assertThrows`, `assertAll`), or AssertJ if the module already depends on
      it. Do NOT add a new test dependency.
    - Assert one logical behaviour per test.

  Error paths:
    - Assert the happy path AND at least one boundary or error case, e.g.
      `assertThrows(IllegalArgumentException.class, () -> Calc.divide(1, 0))`.

  Determinism (avoid flaky tests):
    - Never `Thread.sleep` for synchronisation.
    - Do not depend on wall-clock time, default locale or map iteration order.
    - Do not call network services; the lane runs with restricted egress.
